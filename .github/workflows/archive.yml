name: Archive source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"
      - "scripts/request_swh_archive.py"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-heritage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Request Software Heritage archival
        run: python3 scripts/request_swh_archive.py
