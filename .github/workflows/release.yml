name: Release

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validation
        run: |
          python tests/test_demo.py
          python tests/test_release.py
      - name: Package skill
        run: python scripts/package_skill.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/nice-try-gpt-v0.1.0.zip             --title "NiceTryGPT v0.1.0 ☕🤖"             --notes-file .github/release-notes/v0.1.0.md
