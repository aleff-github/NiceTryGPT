name: One-shot Skillstore refresh status

on:
  push:
    branches:
      - ops/marketplace-submissions

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Skillstore metadata refresh
        shell: python
        run: |
          import urllib.request
          import urllib.error

          url = "https://skillstore.io/api/submit?id=7ef96d95-52f3-403b-948c-6f082d0bcf51"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "NiceTryGPT-metadata-refresh-status/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="ignore")
                  print(f"HTTP {response.status}")
                  print(body)
          except urllib.error.HTTPError as exc:
              print(f"HTTP {exc.code}")
              print(exc.read().decode("utf-8", errors="ignore"))
              raise
